name: CI

# Runs on every push and pull request. Each job pins down the return of a defect that
# already reached the repository — not generic verification.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes + cobertura (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de teste
        run: python -m pip install --quiet pytest pytest-cov

      # The fixture tree reproduces sysfs and contains directories like
      # `1-3:1.0`. Colons are reserved on NTFS: a Windows checkout writes
      # mangled 8.3 names and marks the real files as deleted — and a
      # `git add -A` in that state DELETES the fixtures from the repository. This step
      # catches that before it causes damage.
      - name: Arvore de fixtures intacta
        run: |
          faltando=0
          for d in \
            "tests/fixtures/tree/mt7601_ok/sys/bus/usb/devices/1-3:1.0" \
            "tests/fixtures/tree/rtl8811cu_unbound/sys/bus/usb/devices/1-2:1.0" \
            "tests/fixtures/tree/collision_760a/sys/bus/usb/devices/1-4:1.0" ; do
              if [ -d "$d" ]; then echo "OK      $d"
              else echo "FALTA   $d"; faltando=$((faltando+1)); fi
          done
          if [ "$faltando" -gt 0 ]; then
            echo "::error::fixtures com ':' ausentes — provavel commit vindo de checkout Windows"
            exit 1
          fi
          if git ls-files | grep -qE '~[A-Z0-9]{2}\.[0-9]'; then
            echo "::error::nomes 8.3 mutilados versionados (checkout Windows quebrado)"
            git ls-files | grep -E '~[A-Z0-9]{2}\.[0-9]'
            exit 1
          fi

      - name: Testes com gate de cobertura
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -q \
            --cov=src/dongle_rescue \
            --cov-report=term-missing \
            --cov-fail-under=85

      # The CLI was once COMPLETELY broken while all 186 tests
      # passed: main() never injected the real host and the __main__
      # guard was missing, so `python -m ...` exited with code 0 without printing ANYTHING.
      # No unit test caught it, because all of them inject a fake host.
      # This smoke test exercises the production entry point.
      - name: Smoke do CLI (ponto de entrada real)
        env:
          PYTHONPATH: src
        run: |
          saida=$(python -m dongle_rescue.cli.main doctor)
          echo "$saida"
          if [ -z "$saida" ]; then
            echo "::error::`python -m` nao imprimiu nada — guard __main__ ausente?"
            exit 1
          fi
          for esperado in "kernel release:" "journalctl available:" "reboot pending:" ; do
            echo "$saida" | grep -q "$esperado" || {
              echo "::error::doctor nao reportou '$esperado' — host real nao injetado?"
              exit 1; }
          done
          echo "smoke OK: o CLI roda e usa o host real"

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just the latest commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
